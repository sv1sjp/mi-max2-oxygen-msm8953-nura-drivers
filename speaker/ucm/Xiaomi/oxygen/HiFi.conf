# Use case configuration for Xiaomi Mi Max 2
# Headphones and microphones are on the internal PM8953 codec.
# The bottom loudspeaker and the earpiece are two TI TAS2560 amplifiers on
# Quinary MI2S ("Speaker" and "Earpiece" controls), on their own stream
# MultiMedia3 (hw:${CardId},2); "<amp> Amp Switch" selects which one plays.
# "Speaker" plays through both (mono): the earpiece adds mids and highs, with a
# 1 kHz high-pass and 9 dB gain (Android's "speaker-protected" receiver gain).
# Android plays them as stereo and lets the ADSP's SmartAmp limit the earpiece's
# bass, but SmartAmp only processes with I/V feedback, which mainline lacks.
# The PM8953 EAR output is not connected on this phone.
# Quinary must not share MultiMedia1 with the codec: q6routing keeps one output
# port per stream, so a second route on MultiMedia1 either takes the stream away
# from the codec or, when switched off, leaves it with no route at all
# ("Routing not setup for MultiMedia-1 Session").
# Calls (q6voice) likewise use one output port: the codec (PRI_MI2S_RX) by
# default, Quinary while the speaker or the earpiece is selected.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 1"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Loudspeaker playback (bottom speaker + earpiece)"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		# 14 dB amplifier gain, as Xiaomi's Android mixer_paths
		cset "name='Speaker Amp Gain Volume' 14"
		cset "name='Speaker ASI Channel' Left+Right"
		cset "name='Speaker Amp High-pass' Off"
		cset "name='Speaker Amp Switch' 1"
		cset "name='Earpiece Amp Gain Volume' 9"
		cset "name='Earpiece ASI Channel' Left+Right"
		cset "name='Earpiece Amp High-pass' 1 kHz"
		cset "name='Earpiece Amp Switch' 1"
		# off, then on: q6routing skips the DAPM connect if it thinks the
		# route is already set, which can leave the path disconnected
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia3' 0"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia3' 1"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 1"
	]
	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia3' 0"
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
	]

	Value {
		PlaybackPCM "hw:${CardId},2"
		PlaybackPriority 200
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	ConflictingDevice [
		"Headphones"
		"Speaker"
	]

	EnableSequence [
		cset "name='Speaker Amp Switch' 0"
		cset "name='Earpiece Amp Switch' 1"
		# as Xiaomi's Android mixer_paths ("TAS2560 Receiver DAC Volume")
		cset "name='Earpiece Amp Gain Volume' 14"
		cset "name='Earpiece ASI Channel' Left+Right"
		cset "name='Earpiece Amp High-pass' Off"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia3' 0"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia3' 1"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 1"
	]
	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia3' 0"
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='Earpiece Amp Switch' 0"
		cset "name='Speaker Amp Switch' 1"
	]

	Value {
		PlaybackPCM "hw:${CardId},2"
		PlaybackPriority 100
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	Include.hpes.File "/codecs/msm8953-wcd/HeadphonesEnableSeq.conf"
	Include.hpds.File "/codecs/msm8953-wcd/HeadphonesDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackChannels 2
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic1" {
	Comment "Primary Microphone"

	ConflictingDevice [
		"Headset"
		"Mic2"
	]

	Include.pmes.File "/codecs/msm8953-wcd/PrimaryMicEnableSeq.conf"
	Include.pmds.File "/codecs/msm8953-wcd/PrimaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 300
	}
}

SectionDevice."Mic2" {
	Comment "Secondary Microphone"

	ConflictingDevice [
		"Headset"
		"Mic1"
	]

	Include.smes.File "/codecs/msm8953-wcd/SecondaryMicEnableSeq.conf"
	Include.smds.File "/codecs/msm8953-wcd/SecondaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 200
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic1"
		"Mic2"
	]

	Include.hmes.File "/codecs/msm8953-wcd/HeadsetMicEnableSeq.conf"
	Include.hmds.File "/codecs/msm8953-wcd/HeadsetMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 400
		JackControl "Mic Jack"
	}
}
