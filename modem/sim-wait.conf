# systemd drop-in for msm-modem-uim-selection.service, installed by install.sh --sim as
# /etc/systemd/system/msm-modem-uim-selection.service.d/sim-wait.conf
#
# At boot, msm-modem-uim-selection picks the SIM application on the card so that
# ModemManager can use it. It waits 4 s for the card by default, but the oxygen modem
# reads the SIM later, so nothing gets selected and ModemManager reports sim-missing
# (no calls, SMS or data). Waiting up to 30 s fixes that (pmaports#2072).
[Service]
Environment=SIM_WAIT_TIME=30
